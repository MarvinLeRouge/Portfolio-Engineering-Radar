[project]
name = "radar-audit"
version = "0.1.0"
description = "Tool orchestration and normalization engine for Portfolio-Engineering-Radar."
requires-python = ">=3.12"
dependencies = [
    "radar-core",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
radar-core = { workspace = true }

[project.scripts]
radar-audit = "radar_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_audit"]

[tool.pytest.ini_options]
markers = ["slow: real npx/npm fetch, needs network"]
