[project]
name = "radar-core"
version = "0.1.0"
description = "Shared data model (SQLModel) and Alembic migrations for Portfolio-Engineering-Radar."
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_core"]
